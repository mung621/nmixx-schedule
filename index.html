<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>NMIXX 팬싸 스케쥴</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="emoji-picker.css">
  <link rel="stylesheet" href="datetime-picker.css">
  <!-- Firebase SDK (동기화용 — 설정 전에는 로컬 저장만 사용) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>

<header class="header">
  <div class="header-left">
    <button class="mobile-menu-btn btn btn-ghost btn-icon" id="mobile-menu-btn" onclick="toggleSidebar()" aria-label="필터">
      <svg width="18" height="14" viewBox="0 0 18 14" fill="none"><rect y="0" width="18" height="2" rx="1" fill="currentColor"/><rect y="6" width="18" height="2" rx="1" fill="currentColor"/><rect y="12" width="18" height="2" rx="1" fill="currentColor"/></svg>
    </button>
    <div class="header-title" onclick="goHome()" style="cursor:pointer" title="홈으로">🎤 NMIXX 팬싸 스케쥴</div>
    <div class="sync-badge" id="sync-badge">
      <span class="sync-dot" id="sync-dot"></span>
      <span class="sync-text" id="sync-text">로컬 전용</span>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn btn-primary" onclick="openAddModal()">＋ 이벤트 추가</button>
  </div>
</header>

<!-- Mobile sidebar backdrop -->
<div class="sidebar-backdrop" id="sidebar-backdrop" onclick="toggleSidebar()"></div>

<div class="main">
  <!-- Sidebar (rendered by app.js) -->
  <aside class="sidebar" id="sidebar"></aside>

  <!-- Content -->
  <main class="content" id="content">
    <div id="main-content"></div>
  </main>

  <!-- Detail panel (slides in when event is selected) -->
  <aside class="detail-panel" id="detail-panel"></aside>
</div>

<script src="emoji-data.js"></script>
<script src="emoji-picker.js"></script>
<script src="datetime-picker.js"></script>
<script src="app.js"></script>
<script src="sync.js"></script>
</body>
</html>
